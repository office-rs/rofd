[workspace]
resolver = "2"
members = ["crates/dom", "crates/io", "crates/render", "crates/editor", "crates/component", "crates/native-view", "crates/web-view", "examples/native-app"]

[workspace.dependencies]
rofd-dom = { path = "crates/dom" }
rofd-io = { path = "crates/io" }
rofd-render = { path = "crates/render" }
rofd-editor = { path = "crates/editor" }
rofd-component = { path = "crates/component" }
rofd-native-view = { path = "crates/native-view" }
rofd-web-view = { path = "crates/web-view" }
serde = { version = "1", features = ["derive", "rc"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
thiserror = "1"
vello = "0.8"
parley = "0.8"
peniko = "0.6.1"
kurbo = "0.13.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
winit = "0.30"
wgpu = "28"
pollster = "1"
# Xilem + imaging: pinned to the same git revs reditor uses. xilem main (bf81712d44e3)
# is the only xilem compatible with vello 0.8 / parley 0.8 (crates.io 0.4.0 still ships
# vello 0.6). imaging/imaging_vello are the forest-rs backend-agnostic drawing IR +
# the vello bridge; rofd-render produces imaging::record::Scene, web-view converts it
# to vello::Scene via VelloSceneSink.
xilem = { git = "https://github.com/linebender/xilem", rev = "bf81712d44e3" }
masonry_winit = { git = "https://github.com/linebender/xilem", rev = "bf81712d44e3" }
imaging = { git = "https://github.com/forest-rs/imaging.git", rev = "0eea0499d2666195103b9837ac4c3ee474176a5b" }
imaging_vello = { git = "https://github.com/forest-rs/imaging.git", rev = "0eea0499d2666195103b9837ac4c3ee474176a5b" }
rfd = "0.15"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Document", "Element", "Performance", "ResizeObserver", "ResizeObserverEntry", "KeyboardEvent", "MouseEvent", "WheelEvent", "EventTarget"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
# chrono: `std` only (NOT `clock`) — `clock` pulls in SystemTime/Utc::now() which
# (a) violates AGENTS.md §4.4 (library never reads system time) and (b) does not
# build on wasm32-unknown-unknown. `std` provides from_timestamp_millis /
# parse_from_str / format / and_utc / timestamp_millis / and_hms_opt — all dateutil needs.
chrono = { version = "0.4", default-features = false, features = ["std"] }
