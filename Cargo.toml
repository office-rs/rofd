[workspace]
resolver = "2"
members = ["crates/dom", "crates/io", "crates/render", "crates/editor", "crates/component", "crates/xilem-view", "crates/gpui-view", "crates/web-view", "crates/export", "crates/convert", "crates/convert-cli", "crates/convert-java", "crates/convert-node", "crates/xilem-app", "crates/gpui-app", "crates/tauri-app/src-tauri"]

[workspace.dependencies]
# 发布到 crates.io 的 crate 必须带 `version` 字段（cargo publish 拒绝
# path-only 依赖）；因传递依赖 git 仓库（imaging/xilem 等）不发 crates.io
# 的 crate 保持 path-only。
rofd-dom = { version = "0.1.0", path = "crates/dom" }
rofd-io = { version = "0.1.0", path = "crates/io" }
rofd-render = { version = "0.1.0", path = "crates/render" }
rofd-editor = { version = "0.1.0", path = "crates/editor" }
rofd-component = { path = "crates/component" }
rofd-xilem-view = { path = "crates/xilem-view" }
rofd-web-view = { path = "crates/web-view" }
# Convert module (spec 2026-11-06 §6.1): headless OFD->PDF facade layering
# session semantics over io/render/export; not published to crates.io (D4).
rofd-convert = { path = "crates/convert" }
serde = { version = "1", features = ["derive", "rc"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
thiserror = "1"
vello = "0.8"
parley = "0.8"
peniko = "0.6.1"
kurbo = "0.13.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
wgpu = "28"
pollster = "1"
# Xilem + imaging: pinned to the same git revs reditor uses. xilem main (bf81712d44e3)
# is the only xilem compatible with vello 0.8 / parley 0.8 (crates.io 0.4.0 still ships
# vello 0.6). imaging/imaging_vello are the forest-rs backend-agnostic drawing IR +
# the vello bridge; rofd-render produces imaging::record::Scene, web-view converts it
# to vello::Scene via VelloSceneSink.
xilem = { git = "https://github.com/linebender/xilem", rev = "271a27a6d4a930f7878d404f9014e3c50a3a9b88" }
masonry_testing = { git = "https://github.com/linebender/xilem", rev = "271a27a6d4a930f7878d404f9014e3c50a3a9b88" }
imaging = "0.0.1"
imaging_vello = "0.0.1"
# imaging_vello_cpu: web CPU 回退呈现（CpuCanvasRenderTarget）的软栅格后端
# （Task 7, spec 2026-10-18-no-gpu-support §8）。
imaging_vello_cpu = "0.0.1"
rfd = "0.15"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Document", "Element", "Performance", "ResizeObserver", "ResizeObserverEntry", "KeyboardEvent", "MouseEvent", "WheelEvent", "EventTarget", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "CanvasRenderingContext2d", "ImageData"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
# chrono: `std` only (NOT `clock`) — `clock` pulls in SystemTime/Utc::now() which
# (a) violates AGENTS.md §4.4 (library never reads system time) and (b) does not
# build on wasm32-unknown-unknown. `std` provides from_timestamp_millis /
# parse_from_str / format / and_utc / timestamp_millis / and_hms_opt — all dateutil needs.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# web_time::Instant — performance.now() on wasm (std Instant::now() is a hard
# panic on wasm32-unknown-unknown); a std re-export on native. Only the
# monotonic blink animation clock uses it (AGENTS §4.4).
web-time = "1"
# Print module (spec 2026-10-31): rofd-export encodes imaging scenes to PDF
# via krilla (swash reads cmaps for ToUnicode); office-rs-print is the print
# backend base for component/hosts (added here for later tasks; unused
# workspace.dependencies entries are not resolved until a member uses them).
rofd-export = { path = "crates/export" }
krilla = { version = "0.8", features = ["pdf"] }
swash = "0.2"
office-rs-print = { git = "https://github.com/office-rs/print.git", rev = "c2f99d5" }
# gpui line (spec 2026-10-31-gpui-view-gpui-app-design.md §12): gpui-pre is
# the gpui-kit maintainer's snapshot re-publish of zed@08cbb88 — official
# crates.io gpui is a year stale (0.2.2, missing the Windows/IME fixes).
# Exact-pinned; bump ONLY together with the gpui-kit batch so gpui-view and
# gpui-app always compile on one gpui body (the crate names are distinct,
# types mutually exclusive).
gpui-pre = "=0.3.10"
# Platform bootstrap (application()) — same snapshot family, same exact-pin
# + batch-bump contract as gpui-pre.
gpui-pre-platform = "=0.3.10"
# Host UI chrome kit (gpui-component + base + icon assets). Lockstep with
# the family: kit 0.8.1 pins gpui-pre =0.3.10; bump only as one batch.
gpui-kit = "=0.8.1"
# Icon assets shipped alongside gpui-kit. Same batch-bump contract.
gpui-kit-assets = "=0.8.1"
# JNI bridge for the Java binding crate (convert spec §6.4, phase 2 Task 4).
# Same pin as rword convert-java; MIT/Apache-2.0 dual license (spec §9).
jni = "0.21"
# Node binding (convert spec §6.5): same napi pin as rword convert-node.
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
# napi build script hook for the Node binding crate's build.rs.
napi-build = "2"
