# cargo-deny configuration (convert spec §7/D16: conversion-path dependencies
# must be permissively licensed — the published Apache-2.0 binary packages
# may not carry copyleft obligations).
# Run: cargo deny check licenses
# Mirrors rword's deny.toml (same machine, same posture); the allow-list is
# rofd's own graph — entries unused here were dropped (e.g. Unicode-DFS-2016).
#
# Note: cargo-deny 0.16+ simplified the license config ( EmbarkStudios/
# cargo-deny#611): only `allow`/`exceptions` remain — any license NOT listed
# below is rejected, so GPL/LGPL/AGPL families are denied by omission.

[licenses]
# MPL-2.0 note: file-level copyleft only — appears in workspace-wide checking
# of the editor web path, never linked into the rofd-convert binary.
# BSL-1.0 note (spec D16 "全宽松"): Boost Software License — OSI-approved,
# FSF-free, permissive.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "0BSD",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[advisories]
version = 2
yanked = "warn"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
