[package]
name = "rofd-convert"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["ravenq"]
description = "Headless OFD-to-PDF conversion facade for the rofd convert module — one-call bytes-in/bytes-out over the io/render/export stack."
repository = "https://github.com/office-rs/rofd"
homepage = "https://github.com/office-rs/rofd#readme"
keywords = ["ofd", "pdf", "convert", "export"]
categories = ["graphics"]

[dependencies]
# No print backend: the convert line never prints, and the CUPS backend
# is a link-time libcups dependency the distributed binaries must not
# carry (convert spec §9).
rofd-component = { workspace = true, default-features = false }
rofd-io = { workspace = true }
rofd-render = { workspace = true }
rofd-export = { workspace = true }
rofd-dom = { workspace = true }

[dev-dependencies]
# Test-side fixture repacking: write_ofd's v1 full-write emits no resource
# entries, so fixtures needing real image/font bytes through parse_ofd are
# repacked with the same zip crate the io layer uses.
zip = { workspace = true }
