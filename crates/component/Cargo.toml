[package]
name = "rofd-component"
version = "0.1.0"
edition = "2021"

[dependencies]
rofd-dom = { workspace = true }
rofd-render = { workspace = true }
rofd-editor = { workspace = true }
# draw_layers 默认合流在库代码里用 Painter/replay/Affine/Color 合并场景。
# 平台无关（同 rofd-render 的依赖面），不触碰 AGENTS §4.9 平台边界。
imaging = { workspace = true }

[dev-dependencies]
# Migrated sample_drag_select parses the real fixture and builds points.
rofd-io = { workspace = true }
kurbo = { workspace = true }

# Monotonic animation clock for the wasm target (blink deadline). See the
# matching entry in the root Cargo.toml for why web-time and not std.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = { workspace = true }
