[package]
name = "rofd-xilem-view"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
rofd-component = { workspace = true }
xilem = { workspace = true }
# Print dialog state machine (spec 2026-10-31 phase 2): validate_settings /
# PrintSettings type layer for the pure advance transitions.
office-rs-print = { workspace = true, features = ["backend"] }

[dev-dependencies]
# Constructing ScrollDelta PixelDelta in masonry_events tests (dpi boundary).
dpi = "0.1"
# Headless TestHarness driving OfdWidget (same git pin as xilem).
masonry_testing = { workspace = true }
# Harness fixtures construct dom models.
rofd-dom = { workspace = true }
