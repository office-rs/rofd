name: Release Tauri App

# 当一个 GitHub Release 被 published 时，构建 tauri-app 的 Windows 安装包
# （NSIS setup.exe + MSI）并上传到该 Release 的 assets。
#
# 产物命名由 tauri.conf.json 的 productName=rofd 决定：
#   - rofd_<version>_x64-setup.exe  （NSIS 安装器）
#   - rofd_<version>_x64_en-US.msi  （MSI 安装器）
# 安装后的程序名同为 rofd。
#
# 版本号来自 git tag（形如 v0.1.0 → 0.1.0），发版前写入 tauri.conf.json 与
# package.json，与 publish-sdk.yml 的「tag 即版本」约定保持一致。
#
# 平台：仅 Windows。WebGPU 在 WebView2 上开箱即用；macOS/Linux 的系统 WebView
# 尚不完整支持 WebGPU，暂不构建（见 AGENTS.md §2 tauri 宿主说明）。

on:
  release:
    types: [published]
  # 手动重打安装包：release 事件只在首次 publish 触发一次，而 rerun 固定在原
  # commit 上跑（修复构建问题后 rerun 无效）。dispatch 会 checkout main 最新
  # 代码，把产物上传到指定 tag 的 Release assets。
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要上传安装包的 Release tag（如 v0.1.4）'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  release-tauri:
    runs-on: windows-latest
    permissions:
      contents: write   # 上传安装包到 Release assets 需要写权限
    steps:
      - uses: actions/checkout@v4

      - name: Read version from git tag
        id: tag
        shell: bash
        run: |
          # release 事件：tag 在 GITHUB_REF；dispatch 重打：取输入的 release_tag。
          TAG="${{ github.event.release.tag_name || github.event.inputs.release_tag }}"
          # 去掉前导 'v' 作为产物版本号
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/tauri-app/src-tauri

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 把 tag 版本写入 tauri.conf.json 与 package.json，产物文件名即带该版本。
      - name: Sync version from tag
        shell: bash
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            for (const f of ["crates/tauri-app/src-tauri/tauri.conf.json", "crates/tauri-app/package.json"]) {
              const p = JSON.parse(fs.readFileSync(f, "utf8"));
              p.version = process.env.VERSION;
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + "\n");
            }
          '

      - name: Install tauri-app deps
        working-directory: crates/tauri-app
        run: npm install --no-audit --no-fund

      # SDK 的 wasm 产物：tauri-action 触发 vite build（beforeBuildCommand）前必须就绪。
      - name: Build SDK (wasm-pack)
        working-directory: crates/tauri-app
        run: npm run build:sdk

      # dispatch 重打时按 tag 反查 Release id（release 事件自带 id，跳过此步）。
      - name: Resolve release id (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        id: relid
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RID=$(gh api "repos/${{ github.repository }}/releases/tags/${{ github.event.inputs.release_tag }}" --jq '.id')
          echo "release id: $RID"
          echo "id=$RID" >> "$GITHUB_OUTPUT"

      # 官方 action：运行 tauri build（含 beforeBuildCommand=vite build），
      # 把生成的安装包上传到指定 Release 的 assets。
      - name: Build tauri app and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/tauri-app
          releaseId: ${{ github.event.release.id || steps.relid.outputs.id }}
